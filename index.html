    <style>
      .project-summary-list {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto 56px;
        color: #e2e8f0;
      }
      .project-summary-list__title {
        margin: 0 0 20px;
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .project-summary-list__grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .project-summary-card {
        padding: 28px;
        border: 1px solid rgba(96, 165, 250, 0.24);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 16px 42px rgba(2, 8, 23, 0.22);
      }
      .project-summary-card h3 {
        margin: 0 0 24px;
        color: #38bdf8;
        font-size: 1.5rem;
        font-weight: 800;
      }
      .project-summary-card dl { margin: 0; }
      .project-summary-card dt {
        margin-top: 18px;
        color: #7dd3fc;
        font-family: "Fira Code", monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .project-summary-card dt:first-child { margin-top: 0; }
      .project-summary-card dd {
        margin: 8px 0 0;
        color: #cbd5e1;
        font-size: 0.95rem;
        line-height: 1.75;
        word-break: keep-all;
      }
      .skills-proof-section {
        padding: 96px 16px;
        background: #111827;
        color: #e2e8f0;
      }
      .skills-proof-section__inner {
        width: min(1024px, 100%);
        margin: 0 auto;
      }
      .skills-proof-section__title {
        margin: 0 0 48px;
        text-align: center;
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .skills-proof-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .skills-proof-card {
        --skill-accent: #38bdf8;
        --skill-accent-rgb: 56, 189, 248;
        min-width: 0;
        padding: 26px;
        border: 1px solid rgba(var(--skill-accent-rgb), 0.24);
        border-radius: 20px;
        background: rgba(var(--skill-accent-rgb), 0.045);
        box-shadow: 0 16px 42px rgba(2, 8, 23, 0.2);
      }
      .skills-proof-card--backend {
        --skill-accent: #fb923c;
        --skill-accent-rgb: 251, 146, 60;
      }
      .skills-proof-card--data {
        --skill-accent: #a78bfa;
        --skill-accent-rgb: 167, 139, 250;
      }
      .skills-proof-card--realtime {
        --skill-accent: #22d3ee;
        --skill-accent-rgb: 34, 211, 238;
      }
      .skills-proof-card--ai {
        --skill-accent: #34d399;
        --skill-accent-rgb: 52, 211, 153;
      }
      .skills-proof-card__header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .skills-proof-card__icon {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        place-items: center;
        border: 1px solid rgba(var(--skill-accent-rgb), 0.24);
        border-radius: 11px;
        background: rgba(var(--skill-accent-rgb), 0.1);
        color: var(--skill-accent);
      }
      .skills-proof-card__icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }
      .skills-proof-card h3 {
        margin: 0;
        color: #f8fafc;
        font-size: 1.15rem;
        font-weight: 750;
      }
      .skills-proof-card__level {
        display: inline-flex;
        margin-top: 18px;
        padding: 5px 9px;
        border: 1px solid rgba(var(--skill-accent-rgb), 0.25);
        border-radius: 999px;
        background: rgba(var(--skill-accent-rgb), 0.08);
        color: var(--skill-accent);
        font-size: 0.72rem;
        font-weight: 700;
      }
      .skills-proof-card__tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 16px;
      }
      .skills-proof-card__tag {
        padding: 5px 8px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 7px;
        background: rgba(30, 41, 59, 0.72);
        color: #cbd5e1;
        font-family: "Fira Code", monospace;
        font-size: 0.72rem;
      }
      .skills-proof-card__ability {
        margin: 18px 0 0;
        color: #e2e8f0;
        font-size: 0.95rem;
        line-height: 1.7;
        word-break: keep-all;
      }
      .skills-proof-card__proof {
        margin: 15px 0 0;
        padding-top: 14px;
        border-top: 1px solid rgba(148, 163, 184, 0.13);
        color: #94a3b8;
        font-size: 0.82rem;
        line-height: 1.55;
      }
      .skills-proof-card__proof strong {
        color: var(--skill-accent);
        font-weight: 700;
      }
      @media (max-width: 720px) {
        .project-summary-list { width: min(100% - 32px, 1120px); margin-bottom: 40px; }
        .project-summary-list__grid { grid-template-columns: 1fr; }
        .project-summary-card { padding: 22px; }
        .skills-proof-section { padding: 72px 16px; }
        .skills-proof-section__title { margin-bottom: 32px; }
        .skills-proof-grid { grid-template-columns: 1fr; }
        .skills-proof-card { padding: 22px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function () {
        function mountSkillsProof() {
          var original = document.querySelector(
            'section[data-original-skills="true"], section#skills:not(.skills-proof-section)'
          );
          if (!original) return;

          original.dataset.originalSkills = 'true';
          original.id = 'skills-original';
          original.style.display = 'none';
          if (document.getElementById('skills-proof-content')) return;

          var section = document.createElement('section');
          section.id = 'skills';
          section.className = 'skills-proof-section';
          section.setAttribute('aria-labelledby', 'skills-proof-title');
          section.innerHTML = `
            <div id="skills-proof-content" class="skills-proof-section__inner">
              <h2 id="skills-proof-title" class="skills-proof-section__title">Skills</h2>
              <div class="skills-proof-grid">
                <article class="skills-proof-card skills-proof-card--backend">
                  <div class="skills-proof-card__header">
                    <span class="skills-proof-card__icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg>
                    </span>
                    <h3>Backend &amp; Transaction</h3>
                  </div>
                  <span class="skills-proof-card__level">직접 설계·구현</span>
                  <div class="skills-proof-card__tags">
                    <span class="skills-proof-card__tag">Java</span>
                    <span class="skills-proof-card__tag">Spring Boot</span>
                    <span class="skills-proof-card__tag">JPA</span>
                    <span class="skills-proof-card__tag">MySQL</span>
                  </div>
                  <p class="skills-proof-card__ability">트랜잭션 경계와 실패 흐름을 설계할 수 있음</p>
                  <p class="skills-proof-card__proof"><strong>Proof</strong> · DuckChi 부분 성공 정산</p>
                </article>

                <article class="skills-proof-card skills-proof-card--data">
                  <div class="skills-proof-card__header">
                    <span class="skills-proof-card__icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
                    </span>
                    <h3>Data Access &amp; Performance</h3>
                  </div>
                  <span class="skills-proof-card__level">프로젝트 적용·개선</span>
                  <div class="skills-proof-card__tags">
                    <span class="skills-proof-card__tag">PostgreSQL</span>
                    <span class="skills-proof-card__tag">MySQL</span>
                    <span class="skills-proof-card__tag">JPA</span>
                    <span class="skills-proof-card__tag">SQL</span>
                  </div>
                  <p class="skills-proof-card__ability">반복 조회와 계층형 조회를 개선할 수 있음</p>
                  <p class="skills-proof-card__proof"><strong>Proof</strong> · Loggy 최대 40회 → 2회</p>
                </article>

                <article class="skills-proof-card skills-proof-card--realtime">
                  <div class="skills-proof-card__header">
                    <span class="skills-proof-card__icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="M8.5 15.5a5 5 0 0 1 0-7M15.5 8.5a5 5 0 0 1 0 7M5.5 18.5a9 9 0 0 1 0-13M18.5 5.5a9 9 0 0 1 0 13"/><circle cx="12" cy="12" r="1.5"/></svg>
                    </span>
                    <h3>Realtime &amp; Messaging</h3>
                  </div>
                  <span class="skills-proof-card__level">직접 설계·구현</span>
                  <div class="skills-proof-card__tags">
                    <span class="skills-proof-card__tag">WebSocket</span>
                    <span class="skills-proof-card__tag">STOMP</span>
                    <span class="skills-proof-card__tag">Redis</span>
                  </div>
                  <p class="skills-proof-card__ability">실시간 알림과 임시·영구 메시지 흐름을 분리해 설계할 수 있음</p>
                  <p class="skills-proof-card__proof"><strong>Proof</strong> · Loggy 알림·Redis/DB 단일 타임라인</p>
                </article>

                <article class="skills-proof-card skills-proof-card--ai">
                  <div class="skills-proof-card__header">
                    <span class="skills-proof-card__icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24"><path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3ZM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></svg>
                    </span>
                    <h3>AI Integration &amp; Resilience</h3>
                  </div>
                  <span class="skills-proof-card__level">프로젝트 적용·개선</span>
                  <div class="skills-proof-card__tags">
                    <span class="skills-proof-card__tag">Spring Boot</span>
                    <span class="skills-proof-card__tag">MyBatis</span>
                    <span class="skills-proof-card__tag">Gemini</span>
                    <span class="skills-proof-card__tag">Async</span>
                  </div>
                  <p class="skills-proof-card__ability">AI 응답 지연과 형식 편차를 비동기·보정·fallback으로 흡수할 수 있음</p>
                  <p class="skills-proof-card__proof"><strong>Proof</strong> · AvoFit 7일 선응답·23일 비동기 생성</p>
                </article>
              </div>
            </div>`;
          original.parentNode.insertBefore(section, original);
        }

        function mountProjectSummary() {
          var projects = document.getElementById('projects');
          if (!projects || document.getElementById('project-summary-list')) return;

          var summary = document.createElement('section');
          summary.id = 'project-summary-list';
          summary.className = 'project-summary-list';
          summary.setAttribute('aria-labelledby', 'project-summary-title');
          summary.innerHTML = `
          <h2 id="project-summary-title" class="project-summary-list__title">주요 프로젝트 경험</h2>
          <div class="project-summary-list__grid">
            <article class="project-summary-card">
              <h3>Loggy</h3>
              <dl>
                <dt>담당 범위</dt>
                <dd>Meeting·Issue·Branch·Notification 핵심 협업 흐름 설계·구현</dd>
                <dt>핵심 기여</dt>
                <dd>N+1과 분리 저장으로 발생한 조회 비용·맥락 단절을 배치 조회와 Redis·DB 단일 타임라인 병합으로 개선</dd>
                <dt>결과</dt>
                <dd>회의 20개 기준 반복 조회를 최대 40회에서 2회로 줄이고 재입장 후에도 논의가 이어지는 협업 구조 확보</dd>
              </dl>
            </article>
            <article class="project-summary-card">
              <h3>DuckChi</h3>
              <dl>
                <dt>담당 범위</dt>
                <dd>Pay Service의 모임·정산 핵심 생애주기 설계·구현</dd>
                <dt>핵심 기여</dt>
                <dd>중복 정산과 외부 금융 요청 위험을 비관적 락·UNIQUE 제약·멱등키로 차단하고 다건 송금을 건별 독립 트랜잭션으로 분리</dd>
                <dt>결과</dt>
                <dd>5건 중 1건이 실패해도 성공한 4건은 완료 상태로 보존하고 실패한 1건만 재처리 가능한 부분 성공 구조 확보</dd>
              </dl>
            </article>
            <article class="project-summary-card">
              <h3>AvoFit</h3>
              <dl>
                <dt>담당 범위</dt>
                <dd>30일 AI 식단 생성과 응답 안정화 흐름 설계·구현</dd>
                <dt>핵심 기여</dt>
                <dd>60초 이상 지연되던 단일 LLM 작업을 7일 우선 응답·23일 비동기 생성으로 분리하고 보정·fallback 적용</dd>
                <dt>결과</dt>
                <dd>첫 7일 식단을 약 15초대에 제공하고 나머지는 백그라운드에서 완성되는 생성 구조 확보</dd>
              </dl>
            </article>
          </div>`;
          projects.parentNode.insertBefore(summary, projects);
        }

        function mountPortfolioEnhancements() {
          mountSkillsProof();
          mountProjectSummary();
        }

        mountPortfolioEnhancements();
        var root = document.getElementById('root');
        if (root) {
          new MutationObserver(mountPortfolioEnhancements).observe(root, {
            childList: true,
            subtree: true,
          });
        }
      });
    </script>
  </body>
</html>
